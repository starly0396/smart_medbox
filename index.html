<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 약상자 (Smart Med Box)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #BAD0E5;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="date"], input[type="time"] {
            min-height: 3.5rem;
        }
      
        div.cctError {
          position : absolute;
          width : 400px;
          height: 300px;
          transform: translate(-50%, -50%);
          top:50%;
          left:50%;
          
          background-color : #FDF0E7;
          border : solid 1px black;
          border-radius: 50px;

          display:flex;
          flex-direction: column;
          align-items: center;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 숨겨진 오디오 태그 (같은 폴더의 실제 mp3 파일 참조) -->
    <audio id="audioNormal" src="voice_normal.mp3" preload="auto"></audio>
    <audio id="audioTime" src="voice_alarm.mp3" preload="auto" loop></audio>
    <audio id="audioConfirm" src="voice_confirm.mp3" preload="auto"></audio>
    <audio id="audioEmpty" src="voice_empty.mp3" preload="auto"></audio>

    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col h-full border border-gray-200">
        
        <!-- 1. 헤더 (타이틀) 영역 -->
        <div class="bg-[#BBE2F5] py-6 px-4 text-center rounded-t-[2rem] flex justify-center items-center">
            <img src="logo.png" alt="스마트 약상자 타이틀" class="w-full max-w-[340px] h-auto object-contain" onerror="this.src='https://placehold.co/400x120/BBE2F5/000?text=Smart+Med+Box';">
        </div>

        <div class="p-6 flex flex-col gap-6">
            
            <!-- 2. 블루투스 연결 상태 및 버튼 영역 -->
            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200 text-center shadow-sm">
                <div class="flex items-center justify-center gap-2 mb-4">
                    <div id="statusDot" class="w-4 h-4 rounded-full bg-red-500 shadow-sm transition-colors duration-300"></div>
                    <span id="statusText" class="text-gray-700 font-bold text-2xl">기기 미연결</span>
                </div>
                
                <button id="btnConnect" class="w-full bg-[#BBE2F5] hover:bg-[#9EC5DA] active:bg-[#8EB5CA] text-black font-bold py-4 px-4 rounded-xl shadow-md transition-all text-2xl">
                    연결하기
                </button>
                <button id="btnDisconnect" class="w-full bg-gray-300 hover:bg-gray-400 active:bg-gray-500 text-gray-800 font-bold py-4 px-4 rounded-xl shadow-md transition-all text-2xl hidden">
                    연결 끊기
                </button>
                
                <p class="text-xs text-gray-400 mt-3">* 아이폰은 Bluefy 앱으로 접속해주세요.</p>
            </div>

            <div id="connectErrorWindow" style="display:none">
              <div style="position:absolute;transform:translate(-50%,-50%);left:50%;top:50%;width:100%;height:100%;background-color:rgba(0,0,0,0.8)"></div>
              <div class="cctError">
                <h2 class="w-full bg-[#BBE2F5]" style="border-radius:50px 50px 5px 5px;height:80px;display:flex;justify-content: center;align-items: center;font-size:2em;">블루투스 연결 에러!</h2>
                <div style="font-size:1.3em;margin-top:25px">블루투스 기기를 찾을 수 없습니다.<br>약통의 전원이 켜져 있는지 확인해 주세요.<br>*아이폰은 Bluefy앱으로 접속해주세요</div>
                <button id="btnStopErrorwid" class="bg-[#BBE2F5] hover:bg-[#9EC5DA] active:bg-[#8EB5CA] text-black font-bold py-4 px-4 rounded-xl shadow-md transition-all text-2xl" style="width:360px;margin-top:25px">확인</button>
              </div>
            </div>
          
            <!-- 3. 복용 기간 및 시간 설정 영역 -->
            <div class="bg-orange-50 rounded-2xl p-5 border border-orange-200 shadow-sm">
                <h2 class="text-gray-800 font-bold text-2xl mb-3 flex items-center">
                    <i class="fa-regular fa-calendar-check text-orange-500 mr-2 text-2xl"></i> 약 복용 일정 관리
                </h2>
                
                <div id="periodDisplay" class="bg-white border-2 border-orange-200 rounded-xl p-4 text-center font-bold text-gray-700 text-lg mb-3 shadow-inner break-keep leading-relaxed">
                    복용 기간과 시간이 설정되지 않았습니다.
                </div>
                
                <button id="btnShowPeriodForm" class="w-full bg-[#BBE2F5] hover:bg-[#9EC5DA] active:bg-[#8EB5CA] text-black font-bold py-4 px-4 rounded-xl shadow-md transition-colors text-2xl">
                    기간 및 시간 설정하기
                </button>
              
                <!-- 상세 설정 폼 -->
                <div id="periodForm" class="hidden mt-4 bg-white p-4 rounded-xl border border-orange-200 shadow-inner flex flex-col gap-4">
                    <div>
                        <label class="block text-xl font-bold text-gray-600 mb-1">복용 시작일</label>
                        <input type="date" id="startDate" class="w-full border-2 border-gray-300 rounded-lg p-2 text-lg focus:outline-none focus:border-[#EFA74C] bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xl font-bold text-gray-600 mb-1">복용 종료일</label>
                        <input type="date" id="endDate" class="w-full border-2 border-gray-300 rounded-lg p-2 text-lg focus:outline-none focus:border-[#EFA74C] bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xl font-bold text-gray-600 mb-1">하루 복용 횟수</label>
                        <select id="doseCount" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg focus:outline-none focus:border-[#EFA74C] bg-gray-50 font-bold text-gray-700">
                            <option value="1">하루 1회</option>
                            <option value="2" selected>하루 2회</option>
                            <option value="3">하루 3회</option>
                        </select>
                    </div>
                    <div id="timeInputsContainer" class="flex flex-col gap-2"></div>

                    <button id="btnSavePeriod" class="w-full bg-[#BBE2F5] hover:bg-[#9EC5DA] active:bg-[#8EB5CA] text-black font-bold py-4 px-4 rounded-xl shadow transition-colors text-2xl mt-2">
                        설정 완료
                    </button>
                </div>
            </div>

            <!-- 4. 아두이노 신호 상태 출력 영역 -->
            <div class="flex-1 bg-gray-100 rounded-2xl p-6 border-2 border-gray-300 flex flex-col justify-center items-center min-h-[180px] text-center transition-all duration-500 shadow-inner" id="messageBox">
                <i id="messageIcon" class="fa-solid fa-box-open text-5xl text-gray-400 mb-4 transition-all duration-300"></i>
                <p id="messageText" class="text-2xl font-bold text-gray-600 break-keep leading-snug">
                    블루투스를<br>연결해주세요.
                </p>
            </div>
        </div>
    </div>

    <!-- 5. 커스텀 모달 알림창 -->
    <div id="alarmModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden flex items-center justify-center p-6 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden shadow-2xl transform transition-all scale-100 border-4 border-red-500">
            <div class="bg-red-500 p-8 text-center">
                <i class="fa-solid fa-bell fa-shake text-7xl text-white mb-4"></i>
                <h2 class="text-4xl font-bold text-white tracking-wide">약 드실 시간!</h2>
            </div>
            <div class="p-8 text-center bg-red-50">
                <p class="text-2xl font-bold text-gray-800 break-keep leading-relaxed">
                    어르신,<br>지금 약을 드실 시간입니다.
                </p>
                <p class="text-red-600 mt-4 font-black text-2xl bg-red-100 py-2 rounded-lg">
                    잊지 말고 챙겨 드세요!
                </p>
            </div>
            <div class="p-5 bg-white">
                <button id="btnStopAlarm" class="w-full bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold py-5 px-4 rounded-2xl text-2xl shadow-xl transition-colors">
                    확인 (알람 끄기)
                </button>
            </div>
        </div>
    </div>

    <script>

        let defaultTimes = ['08:00', '13:00', '19:00'];
      
        const audioNormal = document.getElementById('audioNormal');
        const audioTime = document.getElementById('audioTime');
        const audioConfirm = document.getElementById('audioConfirm');
        const audioEmpty = document.getElementById('audioEmpty');

        const allAudios = [audioNormal, audioTime, audioConfirm, audioEmpty];

        // 브라우저 오디오 잠금 해제 (최초 화면 터치 시 실행)
        document.addEventListener('click', () => {
            allAudios.forEach(a => a.load());
        }, { once: true });

        // 재생 중인 모든 오디오 정지 (상태 전환 시 겹쳐 재생 방지)
        function stopAllVoice() {
            allAudios.forEach(a => {
                a.pause();
                a.currentTime = 0;
            });
        }

        // A 신호: "아직 약 복용 시간이 아닙니다" 1회 재생
        function playNormalVoice() {
            stopAllVoice();
            audioNormal.play().catch(e => console.log("오디오 재생 대기 중:", e));
        }

        // B 신호: "지금 약 드실 시간입니다" 음성 반복 재생
        function playAlarmVoice() {
            stopAllVoice();
            audioTime.play().catch(e => console.log("오디오 재생 대기 중:", e));
        }

        // 알람 멈추기 (B 전용, 모달 닫을 때 사용)
        function stopAlarmVoice() {
            audioTime.pause();
            audioTime.currentTime = 0;
        }

        // D 신호: "약 복용이 확인되었습니다" 음성 1회 재생
        function playConfirmVoice() {
            stopAllVoice();
            audioConfirm.play().catch(e => console.log("오디오 재생 대기 중:", e));
        }

        // C 신호: "약통이 비었습니다" 음성 1회 재생
        function playEmptyVoice() {
            stopAllVoice();
            audioEmpty.play().catch(e => console.log("오디오 재생 대기 중:", e));
        }

        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        const timeDisplay = document.getElementById("timeDispaly");
        const btnShowtimeSeting = document.getElementById("btnShowtimeSeting");
        const timeSeting = document.getElementById("timeSeting");
        
        const btnShowPeriodForm = document.getElementById('btnShowPeriodForm');
        const periodForm = document.getElementById('periodForm');
        const btnSavePeriod = document.getElementById('btnSavePeriod');
        const periodDisplay = document.getElementById('periodDisplay');
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const doseCount = document.getElementById('doseCount');
        const timeInputsContainer = document.getElementById('timeInputsContainer');

        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const messageIcon = document.getElementById('messageIcon');

        const alarmModal = document.getElementById('alarmModal');
        const btnStopAlarm = document.getElementById('btnStopAlarm');

        // ==================================================
        // 아두이노로 값 보내기 공통 함수
        // ==================================================
        async function sendToArduino(text) {
            if (!bluetoothCharacteristic) {
                console.warn('블루투스가 연결되어 있지 않아 전송을 건너뜁니다:', text);
                return;
            }
            const data = new TextEncoder().encode(text + '\n');
            try {
                if (bluetoothCharacteristic.writeValueWithoutResponse) {
                    await bluetoothCharacteristic.writeValueWithoutResponse(data);
                } else {
                    await bluetoothCharacteristic.writeValue(data);
                }
            } catch (error) {
                console.error('전송 실패:', text, error);
            }
        }

        // ==================================================
        // 설정된 복용 시간 목록 + 시간 일치 체크
        // ==================================================
        let doseTimes = [];              // 중복 제거된 "HH:MM" 시간 배열
        let lastCheckedMinuteKey = null;  // 같은 분(分)에 중복 전송 방지용

        function checkScheduleTime() {
            if (doseTimes.length === 0) return;

            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const nowTimeStr = `${hh}:${mm}`;
            const minuteKey = `${now.toDateString()}_${nowTimeStr}`; // 날짜+시:분 고유값

            if (minuteKey === lastCheckedMinuteKey) return; // 이미 이 분에 체크함
            lastCheckedMinuteKey = minuteKey;

            if (doseTimes.includes(nowTimeStr)) {
                sendToArduino('TIME');
            }
        }

        setInterval(checkScheduleTime, 5000); // 5초 간격으로 분 변경 감지

        function renderTimeInputs() {
            const count = parseInt(doseCount.value);
            timeInputsContainer.innerHTML = ''

            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';
                div.innerHTML = `
                    <label class="w-30 text-lg font-bold text-gray-600">${i+1}번째 시간:</label>
                    <input type="time" id="doseTime_${i}" value="${defaultTimes[i]}" class="flex-1 border-2 border-gray-300 rounded-lg p-2 text-lg focus:outline-none focus:border-[#EFA74C] bg-gray-50">
                `;
                timeInputsContainer.appendChild(div);
            }
        }

        doseCount.addEventListener('change', renderTimeInputs);

        document.getElementById("btnStopErrorwid").addEventListener('click', ()=>{
          document.getElementById("connectErrorWindow").style.display = "none";
        })

        btnShowPeriodForm.addEventListener('click', () => {
            periodForm.classList.remove('hidden');
            btnShowPeriodForm.classList.add('hidden');
            renderTimeInputs();
        });

        // ==================================================
        // 설정 완료: 중복 시간 통합 + COUNT 전송
        // ==================================================
        btnSavePeriod.addEventListener('click', () => {
            if (startDate.value && endDate.value) {
                const count = parseInt(doseCount.value);
                let rawTimes = [];

                for (let i = 0; i < count; i++) {
                    const timeVal = document.getElementById(`doseTime_${i}`).value;
                    if (timeVal) rawTimes.push(timeVal);
                }

                // 중복된 시간 통합 (Set으로 중복 제거 후 시간순 정렬)
                doseTimes = [...new Set(rawTimes)].sort();

                periodDisplay.innerHTML = `
                    📅 ${startDate.value} ~ ${endDate.value}<br>
                    ⏰ 하루 ${doseTimes.length}회 (${doseTimes.join(', ')})
                `;

                doseTimes.forEach((t, i) => {
                  defaultTimes[i] = t;
                });

                // 통합된 횟수(count)를 아두이노로 전송
                sendToArduino('COUNT_' + doseTimes.length);

                lastCheckedMinuteKey = null; // 시간이 바뀌었으니 체크 상태 초기화
            } else {
                periodDisplay.innerText = "시작일과 종료일을 모두 선택해주세요.";
            }
            periodForm.classList.add('hidden');
            btnShowPeriodForm.classList.remove('hidden');
        });

        function showModal() {
            alarmModal.classList.remove('hidden');
        }

        function hideModal() {
            alarmModal.classList.add('hidden');
            stopAlarmVoice();
        }

        // 확인(알람 끄기) 버튼 클릭 시 BSA 신호 전송
        btnStopAlarm.addEventListener('click', () => {
            hideModal();
            sendToArduino('BSA');
        });

        function updateStatusUI(signal) {
            messageBox.className = 'flex-1 rounded-2xl p-6 border-2 flex flex-col justify-center items-center min-h-[180px] text-center transition-all duration-500 shadow-inner';
            
            switch(signal) {
                case 'A':
                    messageBox.classList.add('bg-teal-50', 'border-teal-300');
                    messageIcon.className = 'fa-solid fa-mug-hot text-6xl text-teal-400 mb-4';
                    messageText.innerHTML = "아직 약 복용 시간이<br>아닙니다.";
                    messageText.className = 'text-2xl font-bold text-teal-800 break-keep leading-snug';
                    playNormalVoice();
                    break;
                    
                case 'B':
                    messageBox.classList.add('bg-red-50', 'border-red-400');
                    messageIcon.className = 'fa-solid fa-capsules fa-bounce text-6xl text-red-500 mb-4';
                    messageText.innerHTML = "지금 약 드실 시간입니다!";
                    messageText.className = 'text-2xl font-bold text-red-700 break-keep leading-snug';
                    playAlarmVoice();
                    showModal();
                    break;
                    
                case 'C':
                    messageBox.classList.add('bg-yellow-50', 'border-yellow-400');
                    messageIcon.className = 'fa-solid fa-triangle-exclamation text-6xl text-yellow-500 mb-4';
                    messageText.innerHTML = "약통이 비었습니다.<br>약을 채워주세요.";
                    messageText.className = 'text-2xl font-bold text-yellow-800 break-keep leading-snug';
                    playEmptyVoice();
                    break;

                case 'D':
                    messageBox.classList.add('bg-teal-50', 'border-teal-300');
                    messageIcon.className = 'fa-solid fa-mug-hot text-6xl text-teal-400 mb-4';
                    messageText.innerHTML = "아직 약 복용 시간이<br>아닙니다.";
                    messageText.className = 'text-2xl font-bold text-teal-800 break-keep leading-snug';
                    playConfirmVoice()
                    break;
            }
        }

        let bluetoothDevice;
        let bluetoothCharacteristic;

        const HM10_SERVICE_UUID = 0xFFE0;
        const HM10_CHARACTERISTIC_UUID = 0xFFE1;

        // ==================================================
        // [신규] Notify가 안 들어오는 HM-10 클론 대응용 폴링
        // 1초마다 직접 값을 읽어와서 상태를 체크합니다.
        // ==================================================
        let btPollInterval = null;
        let lastPolledValue = null; // 같은 값 연속 처리 방지 (MODE_2가 계속 유지되는 동안 알람 반복 방지)

        async function connectBluetooth() {
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [0xFFE0] }],
                    optionalServices: [0xFFE0]
                });

                const server = await bluetoothDevice.gatt.connect();

                const service = await server.getPrimaryService(HM10_SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(HM10_CHARACTERISTIC_UUID);

                // Notify도 일단 구독은 시도 (지원되는 모듈이면 정상 동작하니 남겨둠)
                await bluetoothCharacteristic.startNotifications();
                bluetoothCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                
                statusDot.classList.replace('bg-red-500', 'bg-green-500');
                statusText.innerText = "약통 연결됨";
                btnConnect.classList.add('hidden');
                btnDisconnect.classList.remove('hidden');
                
                updateStatusUI('A'); 

            } catch (error) {
                debugLog('연결 실패: ' + error.name + ' / ' + error.message);
                document.getElementById("connectErrorWindow").style.display = "block";
            }
        }

        function handleNotifications(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            let receivedString = decoder.decode(value).trim();
            debugLog('[notify 이벤트] "' + receivedString + '"');
            
            if (receivedString == 'MODE_1') updateStatusUI('A');
            else if (receivedString == 'MODE_2') updateStatusUI('B');
            else if (receivedString == 'MODE_3') updateStatusUI('C');
          else if (receivedString == 'MODE_4') updateStatusUI('D');
        }

        async function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        }

        function onDisconnected() {
            stopPolling();

            statusDot.classList.replace('bg-green-500', 'bg-red-500');
            statusText.innerText = "기기 미연결";
            btnConnect.classList.remove('hidden');
            btnDisconnect.classList.add('hidden');
            
            messageBox.className = 'flex-1 bg-gray-100 rounded-2xl p-6 border-2 border-gray-300 flex flex-col justify-center items-center min-h-[180px] text-center shadow-inner';
            messageIcon.className = 'fa-solid fa-box-open text-5xl text-gray-400 mb-4';
            messageText.innerHTML = "블루투스를<br>다시 연결해주세요.";
            messageText.className = 'text-2xl font-bold text-gray-600 break-keep leading-snug';
            
            stopAllVoice();
            hideModal();
        }

        btnConnect.addEventListener('click', connectBluetooth);
        btnDisconnect.addEventListener('click', disconnectBluetooth);
    </script>
</body>
</html>
